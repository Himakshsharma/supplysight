[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplysight"
version = "1.0.0"
description = "SupplySight – AI-powered procurement and demand intelligence for SAP ERP (MM/PP). Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Himaksh Sharma" }]
license = { text = "MIT" }
# Core: everything needed to generate data, train, evaluate and run the copilot offline.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pydantic>=2.5",
  "PyJWT>=2.8",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# API + dashboard + faster/better optional backends (used by Docker and CI)
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "streamlit>=1.40",
  "plotly>=5.19",
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "lightgbm>=4.3",
  "rapidfuzz>=3.6",
  "sqlglot>=23.0",
  "mlflow>=2.11",
]
# Deep-learning backends: PyTorch autoencoder, sentence-transformer embeddings, ONNX
dl = ["torch>=2.2", "onnx>=1.15", "onnxruntime>=1.17", "sentence-transformers>=2.6"]
# Evidently drift reports (the built-in PSI/KS report works without it)
monitor = ["evidently>=0.4.40"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.6"]
full = ["supplysight[serve,dl,monitor,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008", "B023", "UP017", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["supplysight", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/supplysight"]
omit = ["src/supplysight/copilot/llm.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

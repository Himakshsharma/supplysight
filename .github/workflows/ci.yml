name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[serve,dev]"
      - name: Unit + integration tests (small seeded dataset)
        run: pytest --cov=src/supplysight --cov-report=term-missing --cov-report=xml
      - name: End-to-end pipeline on the seed-42 dataset
        run: |
          python scripts/generate_data.py --seed 42
          python scripts/train_all.py --quick
      - name: Copilot evaluation (offline) with quality gates
        run: python scripts/evaluate_all.py --module copilot --min-router 0.9 --min-sql 0.85 --min-hit3 0.85
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            artifacts/reports
            docs/COPILOT_EVAL.md

  postgres-smoke:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: supplysight, POSTGRES_PASSWORD: supplysight, POSTGRES_DB: supplysight}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U supplysight" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://supplysight:supplysight@localhost:5432/supplysight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[serve]"
      - run: python scripts/generate_data.py --small
      - run: python scripts/train_all.py --quick
      - name: Services and copilot on PostgreSQL
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from supplysight.services import core
          from supplysight.copilot.agent import Copilot
          print(core.overview()["spend_90d"])
          print(len(core.list_flags(risk="High,Medium")))
          for q in ["Top 5 vendors by spend", "Which materials may stock out?", "DROP TABLE ekpo"]:
              a = Copilot().ask(q); print(q, "->", a.route, a.row_count, a.blocked)
          PY

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t supplysight:ci .

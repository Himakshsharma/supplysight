[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplysight"
version = "1.0.0"
description = "SupplySight – AI-powered procurement and demand intelligence for SAP ERP (MM/PP). Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Himaksh Sharma" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pydantic>=2.5",
  "PyJWT>=2.8",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Full production stack. `pip install -e ".[full]"`
full = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "streamlit>=1.32",
  "plotly>=5.19",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "lightgbm>=4.3",
  "torch>=2.2",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "rapidfuzz>=3.6",
  "sqlglot>=23.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.6",
  "mlflow>=2.11",
  "evidently==0.4.40",
  "statsmodels>=0.14",
  "Faker>=24.0",
]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.3", "black>=24.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/supplysight"]
omit = ["src/supplysight/api/*", "src/supplysight/forecast/torch_models.py", "src/supplysight/anomaly/torch_autoencoder.py"]
